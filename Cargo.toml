[package]
name = "pgrdf"
version = "0.6.31"
# #72: edition 2024 + resolver "3" — pgrx 0.17+ migrated and 0.19
# restated it; staying on 2021 was drift, not breakage. resolver "3"
# is edition 2024's default, declared explicitly because the workspace
# reads clearer than the implication.
edition = "2024"
resolver = "3"
# MSRV. The shared builder (ck-rust-builder:trixie-pg18, rustc 1.97.1)
# is the only Rust pgRDF artifacts are actually produced against; the
# check-cfg lint block below assumes 1.91+ strict check-cfg, and pgrx
# =0.19.2 imposes the 1.96 floor this declares. Bump together with the
# builder image when upgrading.
rust-version = "1.96"
license = "MIT"
authors = ["Peter Styk"]
description = "Rust-native PostgreSQL extension for RDF, SPARQL, SHACL and OWL reasoning"
repository = "https://github.com/styk-tv/pgRDF"
homepage = "https://github.com/styk-tv/pgRDF"
documentation = "https://docs.rs/pgrdf"
readme = "README.md"
keywords = ["postgres", "pgrx", "rdf", "sparql", "shacl"]
categories = ["database", "database-implementations"]

[lib]
# `"lib"` retained (beyond the cdylib) so `cargo test --lib` can run the
# plain-Rust unit suites (dict/loader/reasonable/... `#[cfg(test)]` mods).
# pgrx 0.18+ no longer *needs* it for schema generation (single-pass embed),
# but it is not prohibited — see v18.0-MIGRATION.md.
crate-type = ["cdylib", "lib"]

# pgrx 0.18 removed the two-pass schema build: metadata is embedded into the
# cdylib during the normal build, so the separate `pgrx_embed` bin target and
# `src/bin/pgrx_embed.rs` are gone (v18.0-MIGRATION.md).

[features]
# No default feature — every invocation MUST pick a PG major explicitly
# (cargo pgrx run pgN, --features pgN, etc). pgrx's per-PG features are
# mutually exclusive, so leaving any one as default makes the wrong
# things implicit.
default = []
# pgrx 0.19 supports PG 13-19. E-006 blockers cleared: E0658 (`NonNull::from_mut`)
# needs Rust >=1.96 (pgrx MSRV, satisfied); E0716 (`impl_table_iter`) resolved by
# the SqlTranslatable->associated-const migration (static promotion in const ctx).
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

# `pgrx::pg_shmem_init!` and the per-PG `#[pg_guard]` shims expand to
# `#[cfg(feature = "pg13")]` and `#[cfg(feature = "pg18")]` branches
# even when those features are not declared in our Cargo.toml. Rust
# 1.91+'s strict check-cfg promotes those to `unexpected_cfgs` warnings,
# which CI's `-D warnings` turns into hard errors. Explicitly declare
# the values as known so the lint stays quiet without weakening the
# overall warning level.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("pg13", "pg19"))',
] }

[dependencies]
pgrx  = "=0.19.2"
# Pin to `0.3` to match what oxttl 0.2.3 transitively resolves to.
# `cargo tree` shows: oxttl v0.2.3 → oxrdf v0.3.3. Using `oxrdf = "0.2"`
# split the graph (my pin to 0.2.4, oxttl's to 0.3.3) and types didn't
# unify. The published cargo-info output for oxttl@0.2.3 misleadingly
# shows "Adding oxrdf v0.2.4" because oxttl's manifest allows both
# majors — cargo prefers 0.3.x when no other constraint pulls it down.
oxrdf      = "0.3"
oxttl      = "0.2"   # Turtle / N-Triples / TriG / N-Quads. Latest stable as of 2026-05-13.
spargebra  = "0.4"   # SPARQL 1.1 parser → algebra AST. Pins =0.3.3 on oxrdf (matches our own).
serde_json = "1"     # Used by load_turtle_verbose and sparql_parse to emit JSONB.
# #118: the loader records sha256 of the exact input bytes it consumed
# (source_sha256 on _pgrdf_graphs). 0.11.0 verified latest stable on
# crates.io 2026-08-16 (published 2026-03-25); 0.10.9 was the prior line.
sha2       = "0.11"
# Phase 4: OWL 2 RL forward-chain reasoner. Pulls in `oxrdf ^0.3.3`
# transitively (matches our own pin) plus datafrog / disjoint-sets /
# roaring / rio_api. 0.4.1 (2026-05-10) supersedes the v0.2-LLD
# reference to 0.2; see specs/ERRATA.v0.2.md for the rationale.
#
# The `features = ["rdf-12"]` opts into the passthrough feature on
# the styk-tv/reasonable fork (branch `rdf12-passthrough`, redirected
# via `[patch.crates-io]` at the end of this file). The passthrough
# feature forwards to `oxrdf/rdf-12`, which then unifies workspace-wide
# with the `rdf-12` enablement that `shacl 0.3.x` (via `rudof_rdf`)
# pulls in non-optionally. Drop the feature + the patch once
# gtfierro/reasonable merges the upstream PR; see ERRATA.v0.4 E-011.
reasonable = { version = "0.4", features = ["rdf-12"] }
# Phase 5: W3C-conformant SHACL Core validator from the rudof project.
# `shacl 0.3.1` (2026-05-12) consolidated the previous `shacl_ast` +
# `shacl_validation` 0.2.x pair into a single crate, resolving the
# `iri_s` → `rudof_iri` migration half of ERRATA.v0.2 E-009. The
# remaining `rdf-12` half is resolved by the fork patch on `reasonable`
# above; see ERRATA.v0.4 E-011.
#
# `0.3.2` (2026-05-26) — adds the SHACL-SPARQL constraint component
# (`IRComponent::Sparql` + `sh:sparql`/`sh:select` parsing) and the
# `SparqlEngine` target-resolution methods (target_node, target_class,
# target_subject_of, target_object_of, implicit_target_class) that
# `0.3.1` stubbed with `unimplemented!()`. Closes ERRATA.v0.5 E-012:
# `mode => 'sparql'` is no longer an upstream-gated short-circuit and
# the dual-path Track H roadmap (rudof + pgRDF-native) becomes
# implementable. See ROADMAP.md §4 Track H.
shacl = "0.3.2"
# rudof's RDF abstraction layer. `shacl 0.3` exposes its API in terms
# of `rudof_rdf::rdf_core::{RDFFormat, term::Object, ...}` and
# `rudof_rdf::rdf_impl::InMemoryGraph` — none of which `shacl`
# re-exports. The dep is pinned to the same 0.3.x major as `shacl`
# so the type identity unifies workspace-wide.
rudof_rdf = "0.3"
# v0.7.0 parallel bulk-ingest fast path (`load_turtle(..., bulk_load => true)`).
# rayon drives the all-cores PASS-1 parse + PASS-3 triple→id resolve of the
# bulk loader. The parallel regions are PURE-CPU — no SPI / palloc / Postgres
# access inside any rayon closure — which is what keeps it safe on a single PG
# backend thread. Already resolved to 1.12.0 transitively in Cargo.lock; this
# only promotes it to a direct dependency (no version churn). Verified latest
# stable = 1.12.0 on crates.io (2026-06-13).
rayon = "1"

[dev-dependencies]
pgrx-tests = "=0.19.2"
# Needed only by TH-11's walk_schema_for_sparql unit test —
# `shacl::ir::IRSchema::new(PrefixMap)` requires a `PrefixMap` and
# `shacl` does not re-export it. Pinned to the same 0.3.x major as
# `shacl` / `rudof_rdf` so the type identity is workspace-wide.
prefixmap = "0.3"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1

# Temporary: patches `reasonable` to handle `TermRef::Triple(_)` under
# oxrdf's `rdf-12` feature. Required because `shacl 0.3.x` via
# `rudof_rdf` hard-enables that feature workspace-wide, which surfaces
# the otherwise non-exhaustive match in `reasonable`'s
# `lib/src/common.rs:140`. The fork adds a `panic!(...)` arm gated
# behind a new passthrough feature `rdf-12 = ["oxrdf/rdf-12"]` —
# strictly additive when off, panics with a clear message when on.
#
# Tracked as ERRATA.v0.4 E-011. Drop this block + pin `reasonable =
# "0.4.2"` (or whatever ships) once gtfierro/reasonable merges the
# upstream PR (currently held on the fork as PR-DRAFT.md).
[patch.crates-io]
reasonable = { git = "https://github.com/styk-tv/reasonable", branch = "rdf12-passthrough" }
